name: Registry Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate package version
        run: pnpm version:check

      - name: Build registry
        run: pnpm registry:build

      - name: Validate registry contract
        run: pnpm exec vitest run tests/registry-contract.test.ts tests/docs-content.test.ts

  publish:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate package version
        run: pnpm version:check

      - name: Build registry
        run: pnpm registry:build

      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-artifact
          path: public/r/

      - name: (Optional) Publish artifacts
        run: echo "Add publishing steps (GitHub Pages, CDN, or release upload)"
